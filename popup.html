<!DOCTYPE html>
<head>
  <title>Copy as plain text</title>
  <meta charset="UTF-8">
  <link href="./popup.css" rel="stylesheet">
  <link href="./icons/icon-128.png" rel="icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <main>
    <form>
      <div id="source-options">
        <input type="radio" name="source" value="current-tab" id="current-tab" checked><label for="current-tab">From current Tab</label>
        <div style="display: none;"></div>
        <input type="radio" name="source" value="clipboard" id="clipboard"><label for="clipboard">From clipboard</label>
<!--         <button>From current Tab</button>
        <button>From clipboard</button> -->
      </div>
      <textarea readonly id="plain-text-representation"></textarea>
      <div id="CaPT-btn-container">
        <input type="submit" value="Copy as plain text!" id="CaPT-btn">
      </div>
    </form>
  </main>
  <footer>
    <ul>
